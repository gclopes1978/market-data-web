services:
  web:
    build: .
    ports:
      - "8080:80"
    environment:
      # Default: API published on the host at :7013.
      # If the API runs in the same compose network, use e.g. http://market-data-api:8080
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:7013}
    extra_hosts:
      - "host.docker.internal:host-gateway"
