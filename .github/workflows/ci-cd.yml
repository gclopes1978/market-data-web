# CI/CD for the Market Dashboard.
#
# Execution order:
#   1. test   - install locked dependencies, typecheck, run unit tests and build the static site.
#   2. docker - build the production Nginx image, run the container smoke test, then publish on non-PR refs.
#   3. deploy - optional Azure update after publishing, only from main and only when explicitly enabled.
#
# Pull requests validate both source and the runnable image, but never publish or deploy.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel stale work for the same branch/PR to save runner time and avoid publishing superseded commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; publishing and OIDC permissions are granted only to their respective jobs.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm # caches the npm download directory using package-lock.json
      # npm ci uses the committed lockfile so CI installs the same dependency graph as local development.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Retain the compiled site briefly for inspection or downstream workflow use.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  docker:
    needs: test # do not build/publish a container if source checks fail
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # needed only when this job pushes to ghcr.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4 # the smoke test launches a small Node mock API on the runner
        with:
          node-version: 22
      - uses: docker/setup-buildx-action@v3

      # Build locally first: load=true makes the image available to docker run without publishing it.
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true # make the image available to `docker run` on this runner
          tags: market-data-web:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The mock makes the test deterministic and independent of live market-data providers.
      - name: Smoke test
        run: ./smoke/smoke-test.sh market-data-web:smoke

      # GHCR login is skipped for PRs; secrets are not needed to validate an untrusted PR build.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha # reuses the layers built in the smoke-test build

  deploy:
    name: Deploy to Azure Container Apps
    needs: docker
    # This guard prevents PRs and non-main refs from deploying; the repository variable is an explicit opt-in.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # GitHub OIDC token used by azure/login; no long-lived Azure client secret
    steps:
      - name: Azure login with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Azure Container App
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP_NAME }}
          IMAGE: ghcr.io/${{ github.repository }}:latest
        run: |
          az containerapp update \
            --name "$CONTAINER_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE"

      - name: Azure logout
        if: always()
        run: az logout
